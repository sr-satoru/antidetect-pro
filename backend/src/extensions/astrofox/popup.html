<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Star Multi Login</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="vault-container">
    <!-- Top Header -->
    <header class="vault-header">
      <div class="brand">
        <div class="brand-badge">
          <!-- Star Icon -->
          <svg viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-name">Super Star</span>
          <span class="live-dot"><span class="dot"></span> 2FA Ativo</span>
        </div>
      </div>
      <div id="profile-pill" class="profile-pill" title="Perfil em execução">Perfil</div>
    </header>

    <!-- Main Content: Accounts List -->
    <main id="accounts-container" class="accounts-container">
    </main>

    <!-- Footer -->
    <footer class="vault-footer">
      <span>🔒 Super Star Multi Login · 100% Local</span>
    </footer>
  </div>

  <script src="credentials.js"></script>
  <script src="popup.js"></script>
</body>
</html>
