services:
  # 1. Armazenamento S3 Compatível (MinIO)
  minio:
    image: quay.io/minio/minio:latest
    container_name: fury-minio
    restart: always
    ports:
      - "8987:9000"   # Porta onde o cliente faz upload/download dos arquivos diretamente
      - "8988:9001"   # Painel Web administrativo do MinIO
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-furyadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-furypassword123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Inicializador do Bucket no primeiro boot
  createbucket:
    image: minio/mc
    container_name: fury-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-furyadmin} ${S3_SECRET_ACCESS_KEY:-furypassword123};
      /usr/bin/mc mb local/${S3_BUCKET:-fury-sync} || true;
      exit 0;
      "

  # 3. Servidor de Sincronização e Autenticação (NestJS)
  sync-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fury-sync-api
    restart: always
    ports:
      - "12342:12342"
    environment:
      PORT: 12342
      SYNC_TOKEN: ${SYNC_TOKEN}
      JWT_SECRET: ${JWT_SECRET:-fury_super_jwt_secret_dev_key_12345}
      S3_ENDPOINT: http://minio:9000
      # IMPORTANTE: S3_PUBLIC_ENDPOINT deve ser o IP ou Domínio público da sua VPS
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8987}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-furyadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-furypassword123}
      S3_BUCKET: ${S3_BUCKET:-fury-sync}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      - minio

volumes:
  minio_data:
